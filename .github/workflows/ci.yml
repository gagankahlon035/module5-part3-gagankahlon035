
# This GitHub Actions CI workflow automatically checks
# my Module 5 Part 3 project when I push code to GitHub.
# It checks the Docker Compose configuration, builds
# the Docker images, starts the containers, and tests
# the frontend, banking API, and transactions API.
# It also helps find errors before the project is submitted.

name: Module 5 Part 3 CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose configuration
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker containers
        run: docker compose up -d

      - name: Check running containers
        run: docker compose ps

      - name: Test frontend through NGINX
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error http://localhost/; then
              echo "Frontend is working"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend test failed"
          exit 1

      - name: Test banking API
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error http://localhost/api/login; then
              echo "Banking API is working"
              exit 0
            fi
            sleep 3
          done
          echo "Banking API test failed"
          exit 1

      - name: Test transactions API
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error http://localhost/api/transactions; then
              echo "Transactions API is working"
              exit 0
            fi
            sleep 3
          done
          echo "Transactions API test failed"
          exit 1

      - name: Show logs if something fails
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
